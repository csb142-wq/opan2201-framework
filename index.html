<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Title and description are set at load time from content/site_text.md. -->
  <title>Loading…</title>
  <meta id="meta-description" name="description" content="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- No page wording lives in this file. Every visible string is read at load
       time from content/site_text.md (chrome) or content/tool_profiles.md
       (model profiles). The elements below are empty shells that app.js fills.
       data-text="Section::Field" maps an element to a field in site_text.md. -->

  <a class="skip-link" href="#main" data-text="Page::Skip link"></a>

  <header class="site-header">
    <div class="wrap">
      <p class="eyebrow" data-text="Header::Eyebrow"></p>
      <h1 data-text="Header::Title"></h1>
      <p class="lede" data-text-md="Header::Intro"></p>
    </div>
  </header>

  <main id="main" class="wrap">
    <div id="app" aria-live="polite">
      <p class="loading" data-text="Page::Loading"></p>
    </div>
  </main>

  <!-- Markdown parser (renders the prose inside each field). Vendored locally
       (vendor/marked.min.js) so the site has no external dependency. -->
  <script src="vendor/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
